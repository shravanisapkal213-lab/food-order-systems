<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #successMessage {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Place Your Order</h1>

    <form onsubmit="placeOrder(event)">

        <input type="text" id="name" placeholder="Enter your name" required>

        <input type="tel" id="phone" placeholder="Enter mobile number" required>

        <textarea id="address" placeholder="Enter delivery address" rows="4" required></textarea>

        <button type="submit">Place Order</button>

    </form>

    <div id="successMessage">
        ✓ Order placed successfully!
    </div>

</div>

<script>
function placeOrder(event) {
    event.preventDefault();

    document.getElementById("successMessage").style.display = "block";

    setTimeout(function() {
        window.location.href = "order-confirmation.html";
    }, 1500);
}
</script>

</body>
</html>
