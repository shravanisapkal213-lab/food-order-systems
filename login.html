<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Order System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #111;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #0a9f08;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #078006;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #b7dfc0;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .register {
            margin-top: 25px;
            font-size: 16px;
        }

        .register a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form id="loginForm">

        <input type="email"
               id="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               id="password"
               placeholder="Enter Password"
               required>

        <button type="submit">Login</button>

    </form>

    <!-- SUCCESS MESSAGE -->
    <div id="successMessage" class="success-message">
        ✓ Login Successfully!
    </div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email !== "" && password !== "") {

        document.getElementById("successMessage").style.display = "block";

        
        setTimeout(function() {
            window.location.href = "index.html";
        }, 2000);

    }

});

</script>

</body>
</html>
